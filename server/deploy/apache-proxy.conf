# friendsinvoice.sarhsoft.com: forwards everything to the local guard server.
# cPanel per-vhost include (survives httpd.conf rebuilds):
#   /etc/apache2/conf.d/userdata/ssl/2_4/sarhsoft/friendsinvoice.sarhsoft.com/proxy.conf
# Long polls hold a request for up to 25 seconds, so the proxy timeout is longer than that.
ProxyPreserveHost On
ProxyTimeout 60
ProxyPass /.well-known !
ProxyPass / http://127.0.0.1:3077/ timeout=60
ProxyPassReverse / http://127.0.0.1:3077/
RequestHeader set X-Forwarded-Proto "https"
